name: Windows x64

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build and run verification
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-emu-windows-x64
          path: |
            dist/android-emu.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    # Publishing requires an explicit release commit (e.g. 'Release v0.3.0'),
    # checked-in notes and a passing Windows build on that exact commit.
    if: github.event_name == 'push' && github.repository == 'gladok1123/android-emu' && startsWith(github.event.head_commit.message, 'Release v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-emu-windows-x64
          path: dist
      - name: Publish Windows x64 release
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          headline=${HEAD_MESSAGE%%$'\n'*}
          [[ $headline =~ ^Release\ v([0-9]+\.[0-9]+\.[0-9]+)$ ]]
          version=${BASH_REMATCH[1]}
          tag=v$version
          grep -Fx "[assembly: AssemblyInformationalVersion(\"$version\")]" src/AndroidEmu/AssemblyInfo.cs
          (cd dist && sha256sum --check SHA256SUMS.txt)
          gh release create "$tag" --target "$GITHUB_SHA" \
            --title "android-emu $tag — Windows x64" \
            --notes-file "docs/releases/$tag.md" dist/android-emu.exe dist/SHA256SUMS.txt
